    <!-- PHYSICS ENGINE & INTERACTIVE DRAG SCRIPT -->
    <script>
        const card = document.getElementById('card-assembly');
        const clipBracket = document.getElementById('clip-bracket');
        const strapPath = document.getElementById('strap-path');
        const strapInner = document.getElementById('strap-inner');

        let posX = 0, posY = 0;       
        let velX = 0, velY = 0;       
        let isDragging = false;
        let startX = 0, startY = 0;
        let lastPointerX = 0, lastPointerY = 0;
        let animFrameId = null;

        // Spring Physics Tuning
        const STIFFNESS = 0.12;      
        const DAMPING = 0.81;        
        const MASS = 1.2;            

        function render() {
            // Natural dynamic rotation tilt during dragging
            const rotation = (posX * 0.08) + (velX * 0.04);
            card.style.transform = `translate3d(${posX}px, ${posY}px, 0) rotate(${rotation}deg)`;

            const anchorX = window.innerWidth / 2;
            const anchorY = 0;

            const rect = clipBracket.getBoundingClientRect();
            const clipX = rect.left + (rect.width / 2);
            const clipY = rect.top + 2;

            const stretchAmount = Math.max(0, posY * 0.03);
            const strapWidth = Math.max(10, 18 - stretchAmount);
            strapPath.setAttribute('stroke-width', strapWidth);

            const pathData = `M ${anchorX} ${anchorY} Q ${anchorX + (posX * 0.25)} ${(anchorY + clipY) / 2} ${clipX} ${clipY}`;
            strapPath.setAttribute('d', pathData);
            strapInner.setAttribute('d', pathData);
        }

        function physicsLoop() {
            if (isDragging) return;

            const forceX = -STIFFNESS * posX;
            const forceY = -STIFFNESS * posY;

            const accelX = forceX / MASS;
            const accelY = forceY / MASS;

            velX = (velX + accelX) * DAMPING;
            velY = (velY + accelY) * DAMPING;

            posX += velX;
            posY += velY;

            render();

            if (Math.abs(velX) > 0.01 || Math.abs(velY) > 0.01 || Math.abs(posX) > 0.1 || Math.abs(posY) > 0.1) {
                animFrameId = requestAnimationFrame(physicsLoop);
            } else {
                posX = 0; posY = 0;
                velX = 0; velY = 0;
                render();
            }
        }

        card.addEventListener('pointerdown', (e) => {
            isDragging = true;
            card.setPointerCapture(e.pointerId);
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            velX = 0; velY = 0;
            if (animFrameId) cancelAnimationFrame(animFrameId);
        });

        card.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            velX = (e.clientX - lastPointerX) * 0.8;
            velY = (e.clientY - lastPointerY) * 0.8;
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            render();
        });

        card.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;
            physicsLoop();
        });

        card.addEventListener('pointercancel', () => {
            if (!isDragging) return;
            isDragging = false;
            physicsLoop();
        });

        window.addEventListener('resize', render);

        document.addEventListener('DOMContentLoaded', () => {
            posY = -200; 
            render();
            setTimeout(() => { physicsLoop(); }, 200);
        });

        // vCard Generator for Contact Import
        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:MD Anik Sheikh
TITLE:Marketing Officer
TEL;TYPE=CELL:+880123456789
NOTE:Joining Date: 08 Sep 2025 | Valid until left the service
URL;TYPE=Work:https://share.google/lEhKqLuVR0Usu0asv
URL;TYPE=Facebook:https://facebook.com/6mdaniksheikh9
URL;TYPE=Instagram:https://instagram.com/6mdaniksheikh9
URL;TYPE=GitHub:https://github.com/6mdaniksheikh9
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.download = 'MD_Anik_Sheikh.vcf';
            a.href = url;
            a.click();
        }
    </script>
